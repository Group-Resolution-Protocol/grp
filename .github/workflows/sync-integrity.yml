name: sync-integrity

# This workflow is intentionally evaluated from protected public main. It has
# no secrets, checks out untrusted PR bytes without persisting credentials, and
# executes only the verifier and policy loaded from the protected base commit.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sync-integrity:
    name: sync-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SYNC_BASE: ${{ github.event.pull_request.base.sha }}
      SYNC_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Fetch the public base commit
        run: git fetch --no-tags origin "$SYNC_BASE"
      - name: Load the verifier from protected public main
        run: |
          git show "$SYNC_BASE:scripts/verify-public-sync.mjs" > "$RUNNER_TEMP/verify-public-sync.mjs"
          git show "$SYNC_BASE:scripts/public-sync-policy.mjs" > "$RUNNER_TEMP/public-sync-policy.mjs"
      - name: Require an exact maintainer sync manifest
        run: >-
          node "$RUNNER_TEMP/verify-public-sync.mjs"
          --repo="$GITHUB_WORKSPACE"
          --base="$SYNC_BASE"
          --head="$SYNC_HEAD"
