version: 1
name: canonical-morning-inbox
host: grp

personas:
  - id: mica
    display_name: Mica
    instructions: ./personas/mica.md
    first_day: ./first-day/mica.md
    runtime:
      command: claude
      args: ["--permission-mode", "auto", "--name", "Mica"]
      prompt: first_day

  - id: silica
    display_name: Silica
    instructions: ./personas/silica.md
    first_day: ./first-day/silica.md
    runtime:
      command: claude
      args: ["--permission-mode", "auto", "--name", "Silica"]
      prompt: first_day

  - id: cobalt
    display_name: Cobalt
    instructions: ./personas/cobalt.md
    first_day: ./first-day/cobalt.md
    runtime:
      command: claude
      args: ["--permission-mode", "auto", "--name", "Cobalt"]
      prompt: first_day

  - id: argon
    display_name: Argon
    instructions: ./personas/argon.md
    first_day: ./first-day/argon.md
    runtime:
      command: claude
      args: ["--permission-mode", "auto", "--name", "Argon"]
      prompt: first_day

  - id: neon
    display_name: Neon
    instructions: ./personas/neon.md
    first_day: ./first-day/neon.md
    runtime:
      command: claude
      args: ["--permission-mode", "auto", "--name", "Neon"]
      prompt: first_day

rooms:
  - id: dinner
    creator: silica
    about: Choose the team dinner plan before the headcount deadline
    type: ephemeral
    mechanism: simple_majority
    visibility: private
    settings:
      auth: either
      quorum: 1
      voting_window: 900
      settle_window: 0
      max_participants: 2
      max_options: 3
      max_open_decisions: 1
      early_close: true
      creator_votes: false
      read_receipts: true
      choice_visibility: after_decided
      deliberation_mode: optional
      option_proposal_authority: operator
      decision_opening_authority: operator
      conclusion_authority: operator
    members: [silica, mica]

  - id: vendor
    creator: cobalt
    about: Choose a software renewal package
    type: persistent
    mechanism: simple_majority
    visibility: private
    settings:
      auth: either
      quorum: 1
      voting_window: 3600
      settle_window: 0
      max_participants: 2
      max_options: 3
      max_open_decisions: 1
      early_close: true
      creator_votes: false
      read_receipts: true
      choice_visibility: after_decided
      deliberation_mode: optional
      option_proposal_authority: operator
      decision_opening_authority: operator
      conclusion_authority: operator
    members: [cobalt, mica]

  - id: reading
    creator: argon
    about: Coordinate the next reading-group assignment
    type: persistent
    mechanism: simple_majority
    visibility: private
    settings:
      auth: either
      max_participants: 2
      max_open_decisions: 1
      creator_votes: false
      read_receipts: true
      deliberation_mode: optional
    members: [argon, mica]

  - id: archive
    creator: neon
    about: Archive migration project room; no work is currently waiting
    type: persistent
    mechanism: simple_majority
    visibility: private
    settings:
      auth: either
      max_participants: 2
      max_open_decisions: 1
      creator_votes: false
      read_receipts: true
      deliberation_mode: optional
    members: [neon, mica]
